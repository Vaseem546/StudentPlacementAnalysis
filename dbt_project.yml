name: 'student_placement_analytics'
version: '1.0.0'
config-version: 2

profile: 'student_placement_analytics'

model-paths: ["dbt_project/models"]
analysis-paths: ["dbt_project/analyses"]
test-paths: ["dbt_project/tests"]
seed-paths: ["dbt_project/seeds"]
macro-paths: ["dbt_project/macros"]
snapshot-paths: ["dbt_project/snapshots"]

clean-targets:
  - "dbt_project/target"
  - "dbt_packages"

models:
  student_placement_analytics:
    bronze:
      +schema: SILVER
      +materialized: view
    silver:
      +schema: SILVER
      +materialized: table
    gold:
      dimensions:
        +schema: GOLD
        +materialized: table
      facts:
        +schema: GOLD
        +materialized: table
      marts:
        +schema: SEM
        +materialized: view
