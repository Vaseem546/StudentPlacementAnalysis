version: 2

models:
  - name: fact_placement
    description: "Central fact table for student placement offers at offer-line grain"
    columns:
      - name: sk_fact_placement
        tests:
          - unique
          - not_null
      - name: offer_id
        tests:
          - not_null
      - name: offer_line_id
        tests:
          - not_null
      - name: sk_offer_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: sk_date
      - name: sk_student
        tests:
          - not_null
          - relationships:
              to: ref('dim_student')
              field: sk_student
      - name: sk_company
        tests:
          - not_null
          - relationships:
              to: ref('dim_company')
              field: sk_company
      - name: sk_college
        tests:
          - not_null
          - relationships:
              to: ref('dim_college')
              field: sk_college
      - name: ctc_lpa
        tests:
          - not_null
      - name: is_joined
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]
      - name: offer_status
        tests:
          - not_null
          - accepted_values:
              values: ['OFFERED', 'ACCEPTED', 'JOINED', 'REJECTED', 'WITHDRAWN']
