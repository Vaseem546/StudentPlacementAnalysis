student_placement_analytics:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'ROLE_ETL') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'PLACEMENT_DB') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'PLACEMENT_WH') }}"
      schema: SILVER
      threads: 4
      client_session_keep_alive: False
